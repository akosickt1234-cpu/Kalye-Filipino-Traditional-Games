services:
  postgres:
    image: postgres:16-alpine
    container_name: kftg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kftg
      POSTGRES_PASSWORD: kftg
      POSTGRES_DB: kftg
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kftg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kftg -d kftg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kftg_postgres_data:
